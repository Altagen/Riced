name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: go mod tidy (verify)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || \
            (echo "go.mod or go.sum is out of date -- run 'make tidy' locally" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/riced ./cmd/riced
          ./bin/riced version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v1.62

  lint-toml:
    runs-on: ubuntu-latest
    env:
      TAPLO_VERSION: "0.9.3"
    steps:
      - uses: actions/checkout@v4
      - name: Install taplo
        run: |
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-full-linux-x86_64.gz" \
            | gunzip > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo
      - name: Check TOML formatting
        run: taplo format --check
      - name: Validate TOML against JSON Schema
        # Same step `make lint-toml` runs locally; catches manifest typos
        # (wrong enum value, bad hex, unknown key) at PR time.
        run: taplo lint
