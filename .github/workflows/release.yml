name: Release

# Releases trigger on semver tags WITHOUT the leading 'v' (e.g. 0.1.0,
# 1.2.3, 0.2.0-rc1). The release flow is GoReleaser-driven for the
# binaries, with an SBOM (CycloneDX) attached alongside and a
# git-cliff-generated changelog used as the release notes.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  # Build the multi-arch binaries + checksums + GitHub release entry.
  # GoReleaser handles the cross-compilation matrix, the tarballs, and
  # the upload to the release.
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser inspects git history; full clone keeps the
          # changelog-from-git option workable as a fallback.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CycloneDX SBOM, attached to the release as an extra asset alongside
  # the GoReleaser-produced tarballs. Tracks the exact module graph at
  # tag time for downstream supply-chain audits.
  #
  # The official action handles toolchain compat — `go install
  # cyclonedx-gomod@latest` would otherwise fail on the same Go-1.25
  # retroactive bump we hit with govulncheck.
  sbom:
    name: Generate SBOM
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Go SBOM
        # Pinning to ^v1 of cyclonedx-gomod -- "latest" is not a valid
        # semver range here and made the 0.1.0 release fail. ^v1 follows
        # the upstream major (v1.x.y) without surprises.
        uses: CycloneDX/gh-gomod-generate-sbom@v2
        with:
          version: ^v1
          args: mod -licenses -json -output sbom-go-${{ github.ref_name }}.json

      - name: Checksum SBOM
        run: sha256sum "sbom-go-${{ github.ref_name }}.json" > "sbom-go-${{ github.ref_name }}.sha256"

      - name: Upload SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release upload "$VERSION" \
            "sbom-go-${VERSION}.json" \
            "sbom-go-${VERSION}.sha256" \
            --clobber

  # Replace the default GoReleaser release notes with a git-cliff
  # changelog scoped to commits since the previous tag. Conventional
  # commits are grouped by type with emoji headers.
  changelog:
    name: Changelog
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_LATEST.md

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -q '\-'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release edit "$VERSION" \
            --notes-file CHANGELOG_LATEST.md \
            $PRERELEASE_FLAG
